<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>イオンのしくみ｜ハロー英数教室</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
     color:#22262B;background:#fff;line-height:1.6}
header{border-bottom:2px solid #1F3A5F;padding:14px 16px 10px;
       display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
header .t{font-weight:700;color:#1F3A5F;font-size:17px}
header .s{font-size:12px;color:#8A8F98}
.tabs{display:flex;padding:10px 12px 0;flex-wrap:wrap}
.tab{border:1px solid #C7CBD1;background:#fff;border-radius:8px 8px 0 0;margin-right:6px;
     padding:9px 14px;font-size:14px;font-weight:700;color:#8A8F98;cursor:pointer}
.tab.on{background:#1F3A5F;color:#fff;border-color:#1F3A5F}
.wrap{max-width:940px;margin:0 auto;padding:0 12px 40px}
.panel{display:none}.panel.on{display:block}
.scenebar{display:flex;flex-wrap:wrap;margin:12px 0 8px}
.sb{border:1px solid #C7CBD1;background:#fff;border-radius:999px;padding:7px 13px;
    font-size:13px;cursor:pointer;color:#444;margin:0 6px 6px 0}
.sb.on{background:#F5F2EC;border-color:#1F3A5F;color:#1F3A5F;font-weight:700}
.stage{border:1px solid #C7CBD1;border-radius:10px;overflow:hidden;background:#fff}
svg{display:block;width:100%;height:auto}
.keybar{background:#1F3A5F;color:#fff;padding:10px 14px;display:flex;
        align-items:center;flex-wrap:wrap}
.keybar .lbl{font-size:12px;opacity:.85;margin-right:8px}
.keybar .val{font-size:19px;font-weight:700;margin-right:10px}
.keybar .eq{font-size:13px;opacity:.92}
.ctrl{display:flex;align-items:center;flex-wrap:wrap;margin:10px 0}
button.btn{border:1px solid #1F3A5F;background:#fff;color:#1F3A5F;margin:0 10px 6px 0;
   border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
button.btn.on{background:#1F3A5F;color:#fff}
input[type=range]{width:230px;max-width:58vw;vertical-align:middle}
.note{font-size:13px;color:#444;background:#F5F2EC;border-radius:8px;
      padding:10px 12px;margin:10px 0;min-height:18px}
.note b{color:#1F3A5F}
.legend{display:flex;flex-wrap:wrap;font-size:12px;color:#444;margin:8px 0}
.legend span{margin-right:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;
          vertical-align:-1px;margin-right:4px}
.grid4{display:flex;flex-wrap:wrap;margin-top:10px;margin-right:-8px}
.gcard{border:1px solid #C7CBD1;border-radius:8px;padding:6px 6px 2px;
       flex:1 1 155px;margin:0 8px 8px 0}
.gcard h4{margin:0 0 2px;font-size:13px;text-align:center}
.cnt{text-align:center;font-size:11px;color:#8A8F98;margin-bottom:2px}
.readout{font-size:13px;margin:10px 0}
.pill{border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;
      border:1px solid #C7CBD1;margin-right:10px}
footer{border-top:1px solid #C7CBD1;margin-top:24px;padding:12px;
       font-size:11px;color:#8A8F98;text-align:center}
</style>
</head>
<body>
<header>
  <div class="t">イオンのしくみ</div>
  <div class="s">ハロー英数教室　中3 理科／夏期特別講義</div>
</header>

<div class="tabs">
  <button class="tab on" data-tab="0">① 電極で起きていること</button>
  <button class="tab" data-tab="1">② 中和とイオンの数</button>
</div>

<div class="wrap">

<div class="panel on" id="p0">
  <div class="scenebar" id="scenebar"></div>
  <div class="stage">
    <svg id="sv1" viewBox="0 0 760 470"></svg>
    <div class="keybar">
      <span class="lbl">電子が流れ込む電極 ＝</span>
      <span class="val" id="kname">－</span>
      <span class="eq" id="kdesc">－</span>
    </div>
  </div>
  <div class="ctrl">
    <button class="btn" id="play1">一時停止</button>
    <button class="btn on" id="cur1">電流の向きを表示</button>
    <label style="font-size:13px;color:#444">速さ
      <input type="range" id="spd1" min="20" max="220" value="100"></label>
  </div>
  <div class="legend">
    <span><i style="background:#C25B45"></i>陽イオン（＋）</span>
    <span><i style="background:#3F6E9E"></i>陰イオン（−）</span>
    <span><i style="background:#2B2F36"></i>電子</span>
    <span><i style="background:#8C7B62"></i>金属板・電極</span>
  </div>
  <div class="note" id="note1"></div>
</div>

<div class="panel" id="p1">
  <div class="scenebar" id="scenebar2"></div>
  <div class="stage">
    <svg id="sv2" viewBox="0 0 760 432"></svg>
    <div class="keybar">
      <span class="lbl">加えた量</span>
      <span class="val" id="kvol">0</span>
      <span class="eq" id="kstate">－</span>
    </div>
  </div>
  <div class="ctrl">
    <label style="font-size:13px;color:#444;margin-right:12px">加える量
      <input type="range" id="vol" min="0" max="20" value="0" step="1"></label>
    <button class="btn" id="auto2">少しずつ加える</button>
    <button class="btn" id="reset2">最初にもどす</button>
    <button class="btn" id="gonly">グラフだけ表示</button>
  </div>
  <div class="readout" id="ro2"></div>
  <div class="grid4" id="graphs"></div>
  <div class="note" id="note2"></div>
</div>

</div>
<footer>ハロー英数教室　中3 理科／化学変化とイオン</footer>

<script>
var NS = "http://www.w3.org/2000/svg";
function el(t, a) {
  var e = document.createElementNS(NS, t), k;
  for (k in a) { e.setAttribute(k, a[k]); }
  return e;
}
function txt(x, y, s, fs, fill, fw, anchor) {
  var t = el("text", {x:x, y:y, "font-size":(fs || 13), fill:(fill || "#22262B"),
    "text-anchor":(anchor || "middle"), "font-weight":(fw || 400)});
  t.appendChild(document.createTextNode(s));
  return t;
}
var CP = "#C25B45", CM = "#3F6E9E", CE = "#2B2F36", CMT = "#8C7B62",
    INK = "#1F3A5F", TER = "#B5533C", SLA = "#4E6E8E",
    G1 = "#8A8F98", G2 = "#C7CBD1", G3 = "#E4E6EA";

/* ==================== TAB 1 ==================== */
var SCENES = [
 {name:"塩化銅の電気分解", power:true,
  liquid:"塩化銅水溶液　CuCl\u2082 \u2192 Cu\u00B2\u207A + 2Cl\u207B",
  left:{pol:"\uFF0B", name:"陽極"}, right:{pol:"\u2212", name:"陰極"}, gainRight:true,
  ions:[{sym:"Cu\u00B2\u207A", ch:1, n:5}, {sym:"Cl\u207B", ch:-1, n:6}],
  deposit:true, bubbleL:"塩素 Cl\u2082", bubbleR:null, dissolve:false,
  depositTxt:"銅 Cu が付着", keyname:"陰極",
  note:"電源が電子を押し込む側が<b>陰極</b>。そこへ Cu\u00B2\u207A が引かれてきて、電子を2個受け取り、銅の単体になって付着する。反対の陽極では Cl\u207B が電子を手放し、塩素の気体になって出ていく。"},
 {name:"塩酸の電気分解", power:true,
  liquid:"うすい塩酸　2HCl \u2192 2H\u207A + 2Cl\u207B",
  left:{pol:"\uFF0B", name:"陽極"}, right:{pol:"\u2212", name:"陰極"}, gainRight:true,
  ions:[{sym:"H\u207A", ch:1, n:6}, {sym:"Cl\u207B", ch:-1, n:6}],
  deposit:false, bubbleL:"塩素 Cl\u2082", bubbleR:"水素 H\u2082", dissolve:false,
  keyname:"陰極",
  note:"さっきと<b>まったく同じこと</b>が起きている。ちがうのは、陽イオンが Cu\u00B2\u207A ではなく H\u207A だという点だけ。H\u207A は電子を受け取ると水素の気体になるので、付着せずに泡になって出ていく。"},
 {name:"亜鉛と銅の電池", power:false,
  liquid:"うすい塩酸　2HCl \u2192 2H\u207A + 2Cl\u207B",
  left:{pol:"\u2212", name:"亜鉛板"}, right:{pol:"\uFF0B", name:"銅板"}, gainRight:true,
  ions:[{sym:"H\u207A", ch:1, n:6}, {sym:"Cl\u207B", ch:-1, n:5}],
  deposit:false, bubbleL:null, bubbleR:"水素 H\u2082", dissolve:true,
  keyname:"\uFF0B極（銅板）",
  note:"電源がない。かわりに、<b>亜鉛が自分から溶けて</b>電子を置いていく（Zn \u2192 Zn\u00B2\u207A + 2e\u207B）。その電子が導線を通って銅板へ流れ込み、そこで H\u207A が受け取って水素になる。<b>電子が流れ込む電極</b>という点では、電気分解の陰極とまったく同じ立場。名前だけが\uFF0B極に変わる。"},
 {name:"ダニエル電池", power:false, cello:true,
  liquid:"左：硫酸亜鉛水溶液　／　右：硫酸銅水溶液",
  left:{pol:"\u2212", name:"亜鉛板"}, right:{pol:"\uFF0B", name:"銅板"}, gainRight:true,
  ions:[{sym:"Zn\u00B2\u207A", ch:1, n:4, side:"L"}, {sym:"SO\u2084\u00B2\u207B", ch:-1, n:3, side:"L"},
        {sym:"Cu\u00B2\u207A", ch:1, n:5, side:"R"}, {sym:"SO\u2084\u00B2\u207B", ch:-1, n:3, side:"R"}],
  deposit:true, bubbleL:null, bubbleR:null, dissolve:true,
  depositTxt:"銅 Cu が付着", keyname:"\uFF0B極（銅板）",
  note:"亜鉛板が溶けて電子を出し、銅板に流れ込む。銅板では Cu\u00B2\u207A が電子を2個受け取って銅になり、<b>付着する</b>。塩酸の電池とのちがいは、電子を受け取る相手が H\u207A か Cu\u00B2\u207A かだけ。セロハンは、イオンだけが通れるしきり。"}
];
var sc = 0, playing = true, showCur = true, speed = 1, parts = [], activeTab = 0;
var BX = 150, BY = 192, BW = 460, BH = 200;
var EXL = BX + 70, EXR = BX + BW - 70, EW = 26, EY = BY - 20, EH = BH + 10, WY = 108;

var sbEl = document.getElementById("scenebar");
(function () {
  var i;
  for (i = 0; i < SCENES.length; i++) {
    (function (idx) {
      var b = document.createElement("button");
      b.className = "sb" + (idx === 0 ? " on" : "");
      b.appendChild(document.createTextNode(SCENES[idx].name));
      b.onclick = function () {
        sc = idx;
        var c = sbEl.children, j;
        for (j = 0; j < c.length; j++) { c[j].className = "sb" + (j === idx ? " on" : ""); }
        build1();
      };
      sbEl.appendChild(b);
    })(i);
  }
})();

var SV = document.getElementById("sv1");

function newPart(io, S) {
  var xa = BX + 16, xb = BX + BW - 16, tx, goRight;
  if (io.side === "L") { xb = BX + BW / 2 - 16; }
  if (io.side === "R") { xa = BX + BW / 2 + 16; }
  goRight = (io.ch > 0) ? S.gainRight : !S.gainRight;
  if (goRight) { tx = (io.side === "L") ? (BX + BW / 2 - 12) : (EXR - 36); }
  else { tx = (io.side === "R") ? (BX + BW / 2 + 12) : (EXL + 36); }
  return {kind:"i", sym:io.sym, ch:io.ch,
    x: xa + Math.random() * (xb - xa), y: BY + 18 + Math.random() * (BH - 36),
    tx: tx, xa: xa, xb: xb, wob: Math.random() * 6.28};
}

function arrow(y, toLeft, color, label, sub) {
  var g = el("g", {}), x1, x2, cx = 380;
  if (toLeft) { x1 = cx + 78; x2 = cx - 78; } else { x1 = cx - 78; x2 = cx + 78; }
  g.appendChild(el("path", {d:"M" + x1 + " " + y + " L" + x2 + " " + y,
    fill:"none", stroke:color, "stroke-width":3.4,
    "marker-end":"url(" + (color === SLA ? "#ahS" : "#ahE") + ")"}));
  g.appendChild(txt(cx, y - 9, label, 12.5, color, 700));
  if (sub) { g.appendChild(txt(cx + 152, y + 4, sub, 11, G1, 400)); }
  return g;
}

function build1() {
  var S = SCENES[sc], i, j, defs, g, sides, x, e, gain;
  while (SV.firstChild) { SV.removeChild(SV.firstChild); }
  defs = el("defs", {});
  var mk1 = el("marker", {id:"ahS", markerWidth:9, markerHeight:9, refX:8, refY:4.5, orient:"auto"});
  mk1.appendChild(el("path", {d:"M0 0 L9 4.5 L0 9 z", fill:SLA}));
  var mk2 = el("marker", {id:"ahE", markerWidth:9, markerHeight:9, refX:8, refY:4.5, orient:"auto"});
  mk2.appendChild(el("path", {d:"M0 0 L9 4.5 L0 9 z", fill:CE}));
  defs.appendChild(mk1); defs.appendChild(mk2);
  SV.appendChild(defs);

  /* 電子の流れ／電流の向き（常に対で表示） */
  SV.appendChild(arrow(62, !S.gainRight, CE, "電子の流れ", "実際に動いているのは電子"));
  if (showCur) {
    SV.appendChild(arrow(26, S.gainRight, SLA, "電流の向き", "決めごと。電子と逆向き"));
  }

  SV.appendChild(el("rect", {x:BX, y:BY, width:BW, height:BH, fill:"#EAF1F6",
    stroke:G2, "stroke-width":2, rx:4}));
  if (S.cello) {
    SV.appendChild(el("rect", {x:BX + BW / 2 - 4, y:BY, width:8, height:BH, fill:"#D8D2C4"}));
    SV.appendChild(txt(BX + BW / 2, BY + BH + 40, "セロハン", 12, G1));
  }
  sides = [[EXL, S.left, !S.gainRight], [EXR, S.right, S.gainRight]];
  for (i = 0; i < 2; i++) {
    x = sides[i][0]; e = sides[i][1]; gain = sides[i][2];
    SV.appendChild(el("rect", {x:x - EW / 2, y:EY, width:EW, height:EH, fill:CMT, rx:2}));
    if (gain) {
      SV.appendChild(el("rect", {x:x - EW / 2 - 6, y:EY - 6, width:EW + 12, height:EH + 12,
        fill:"none", stroke:TER, "stroke-width":3, rx:5}));
    }
    var lb = e.pol + " " + e.name, lw = lb.length * 8 + 10;
    SV.appendChild(el("rect", {x:x - lw / 2, y:EY - 26, width:lw, height:16, fill:"#fff"}));
    SV.appendChild(txt(x, EY - 14, lb, 15, gain ? TER : INK, 700));
  }
  SV.appendChild(el("path", {d:"M" + EXL + " " + EY + " L" + EXL + " " + WY +
    " L" + EXR + " " + WY + " L" + EXR + " " + EY,
    fill:"none", stroke:CE, "stroke-width":2.5}));

  g = el("g", {id:"pl"});
  SV.appendChild(g);

  if (S.power) {
    SV.appendChild(el("rect", {x:332, y:WY - 19, width:96, height:38, fill:"#fff",
      stroke:INK, "stroke-width":2, rx:4}));
    SV.appendChild(txt(380, WY + 5, "電源装置", 14, INK, 700));
  } else {
    SV.appendChild(el("circle", {cx:380, cy:WY, r:21, fill:"#fff", stroke:INK, "stroke-width":2}));
    SV.appendChild(txt(380, WY + 6, "M", 16, INK, 700));
    SV.appendChild(txt(380, WY - 30, "モーター", 12, G1));
  }
  SV.appendChild(txt(380, BY + BH + 64, S.liquid, 13, "#444"));

  if (S.deposit) {
    SV.appendChild(el("rect", {x:EXR - EW / 2 - 7, y:EY + 34, width:7, height:EH - 58,
      fill:"#A85B3C", rx:2}));
    SV.appendChild(txt(EXR + 74, BY + BH - 12, S.depositTxt, 12, TER, 700));
  }
  if (S.dissolve) {
    SV.appendChild(el("rect", {x:EXL - EW / 2, y:EY + 46, width:EW, height:EH - 82,
      fill:"#EAF1F6", opacity:0.6}));
    SV.appendChild(txt(EXL - 70, BY + BH - 12, "亜鉛がとける", 12, TER, 700));
  }
  if (S.bubbleL) {
    for (i = 0; i < 5; i++) {
      SV.appendChild(el("circle", {cx:EXL - 18 - (i % 2) * 7, cy:BY + 24 + i * 26,
        r:4 + (i % 3), fill:"none", stroke:SLA, "stroke-width":1.4}));
    }
    SV.appendChild(txt(EXL - 62, BY + 14, S.bubbleL, 12, SLA, 700));
  }
  if (S.bubbleR) {
    for (i = 0; i < 5; i++) {
      SV.appendChild(el("circle", {cx:EXR + 18 + (i % 2) * 7, cy:BY + 24 + i * 26,
        r:4 + (i % 3), fill:"none", stroke:SLA, "stroke-width":1.4}));
    }
    SV.appendChild(txt(EXR + 62, BY + 14, S.bubbleR, 12, SLA, 700));
  }

  parts = [];
  for (i = 0; i < S.ions.length; i++) {
    for (j = 0; j < S.ions[i].n; j++) { parts.push(newPart(S.ions[i], S)); }
  }
  for (i = 0; i < 9; i++) { parts.push({kind:"e", p:i / 9}); }

  document.getElementById("kname").innerHTML = S.keyname;
  document.getElementById("kdesc").innerHTML = S.power ?
    "ここに陽イオンが集まって、単体になる" :
    "ここに陽イオンが集まって、単体になる（電気分解の陰極と同じ立場）";
  document.getElementById("note1").innerHTML = S.note;
  draw1(0);
}

function draw1(dt) {
  var S = SCENES[sc], g = document.getElementById("pl"), i, p, q, d, x, y;
  if (!g) { return; }
  while (g.firstChild) { g.removeChild(g.firstChild); }
  var L1 = EY - WY, L2 = EXR - EXL, tot = L1 + L2 + L1;
  for (i = 0; i < parts.length; i++) {
    p = parts[i];
    if (p.kind === "e") {
      if (playing) { p.p += dt * 0.00022 * speed; }
      while (p.p > 1) { p.p -= 1; }
      q = S.gainRight ? p.p : (1 - p.p);
      d = q * tot;
      if (d < L1) { x = EXL; y = EY - d; }
      else if (d < L1 + L2) { x = EXL + (d - L1); y = WY; }
      else { x = EXR; y = WY + (d - L1 - L2); }
      g.appendChild(el("circle", {cx:x, cy:y, r:5.5, fill:CE}));
      g.appendChild(txt(x, y + 3.6, "\u2212", 10, "#fff", 700));
      continue;
    }
    if (playing) {
      p.x += (p.tx - p.x) * 0.0009 * speed * dt;
      p.wob += dt * 0.005;
      p.y += Math.sin(p.wob) * 0.4;
      if (p.y < BY + 18) { p.y = BY + 18; }
      if (p.y > BY + BH - 18) { p.y = BY + BH - 18; }
      if (Math.abs(p.x - p.tx) < 10) {
        p.x = p.xa + Math.random() * (p.xb - p.xa);
        p.y = BY + 18 + Math.random() * (BH - 36);
      }
    }
    g.appendChild(el("circle", {cx:p.x, cy:p.y, r:16, fill:(p.ch > 0 ? CP : CM), opacity:0.93}));
    g.appendChild(txt(p.x, p.y + 4.6, p.sym, 11, "#fff", 700));
  }
}

document.getElementById("play1").onclick = function () {
  playing = !playing;
  this.innerHTML = playing ? "一時停止" : "再生";
  this.className = "btn" + (playing ? "" : " on");
};
document.getElementById("cur1").onclick = function () {
  showCur = !showCur;
  this.className = "btn" + (showCur ? " on" : "");
  build1();
};
document.getElementById("spd1").oninput = function () { speed = this.value / 100; };

/* ==================== TAB 2 ==================== */
var MODES = [
 {name:"塩酸 ＋ 水酸化ナトリウム水溶液", max:20, neutral:10, ymax:20,
  beaker:"うすい塩酸", add:"水酸化ナトリウム水溶液",
  eq:"HCl + NaOH \u2192 NaCl + H\u2082O",
  species:[{sym:"H\u207A", c:"p", f:function (t) { return Math.max(10 - t, 0); }},
           {sym:"Cl\u207B", c:"m", f:function (t) { return 10; }},
           {sym:"Na\u207A", c:"p", f:function (t) { return t; }},
           {sym:"OH\u207B", c:"m", f:function (t) { return Math.max(t - 10, 0); }}],
  water:function (t) { return Math.min(t, 10); }, precip:null,
  note:"<b>Cl\u207B が変わらない</b>のがポイント。Na\u207A と結びついても、塩化ナトリウムは水にとけて電離したままだから、数は減らない。減るのは、水になって消える H\u207A と OH\u207B だけ。"},
 {name:"硫酸 ＋ 水酸化バリウム水溶液", max:10, neutral:5, ymax:10,
  beaker:"うすい硫酸", add:"水酸化バリウム水溶液",
  eq:"H\u2082SO\u2084 + Ba(OH)\u2082 \u2192 BaSO\u2084\u2193 + 2H\u2082O",
  species:[{sym:"H\u207A", c:"p", f:function (t) { return Math.max(10 - 2 * t, 0); }},
           {sym:"SO\u2084\u00B2\u207B", c:"m", f:function (t) { return Math.max(5 - t, 0); }},
           {sym:"Ba\u00B2\u207A", c:"p", f:function (t) { return Math.max(t - 5, 0); }},
           {sym:"OH\u207B", c:"m", f:function (t) { return Math.max(2 * t - 10, 0); }}],
  water:function (t) { return Math.min(2 * t, 10); },
  precip:function (t) { return Math.min(t, 5); },
  note:"こちらは <b>SO\u2084\u00B2\u207B も減る</b>。硫酸バリウムが水にとけない白い沈殿になるから。中性のとき<b>イオンがほぼゼロ</b>になり、電流が流れなくなる \u2500\u2500 ここがよく問われる。"}
];
var md = 0, vol = 0, autoRun = false, gOnly = false, dropT = 0, splash = 0;
var sb2El = document.getElementById("scenebar2");
(function () {
  var i;
  for (i = 0; i < MODES.length; i++) {
    (function (idx) {
      var b = document.createElement("button");
      b.className = "sb" + (idx === 0 ? " on" : "");
      b.appendChild(document.createTextNode(MODES[idx].name));
      b.onclick = function () {
        md = idx; vol = 0;
        var v = document.getElementById("vol"), c = sb2El.children, j;
        v.max = MODES[idx].max; v.value = 0;
        for (j = 0; j < c.length; j++) { c[j].className = "sb" + (j === idx ? " on" : ""); }
        draw2();
      };
      sb2El.appendChild(b);
    })(i);
  }
})();

var SV2 = document.getElementById("sv2");
/* 器具の座標 */
var BKX = 96, BKY = 148, BKW = 182, BKH = 232;      /* ビーカー */
var BUX = 187, BUY = 22, BUH = 88, BUW = 22;        /* ビュレット */
var TIPY = BUY + BUH + 24;

function stateOf(M, T) {
  if (T < M.neutral) { return ["酸性", "#E8B24A", "H\u207A が残っている"]; }
  if (T === M.neutral) { return ["中性", "#5AA469", "H\u207A も OH\u207B もない"]; }
  return ["アルカリ性", "#4E6E8E", "OH\u207B がふえていく"];
}

function surfaceY(M, T) {
  var h = 112 + 80 * (T / M.max);
  return BKY + BKH - h;
}

function drawVessel() {
  var M = MODES[md], T = vol, i, j, n, st = stateOf(M, T);
  while (SV2.firstChild) { SV2.removeChild(SV2.firstChild); }
  if (gOnly) { return; }
  var sy = surfaceY(M, T);

  /* --- ビュレット --- */
  SV2.appendChild(el("rect", {x:BUX - BUW / 2, y:BUY, width:BUW, height:BUH,
    fill:"#fff", stroke:G1, "stroke-width":1.4, rx:2}));
  var remTop = BUY + 4 + (BUH - 12) * (T / M.max);
  SV2.appendChild(el("rect", {x:BUX - BUW / 2 + 2, y:remTop, width:BUW - 4,
    height:(BUY + BUH - 2) - remTop, fill:"#BFD8E8", opacity:0.9}));
  for (i = 1; i < 6; i++) {
    SV2.appendChild(el("line", {x1:BUX + BUW / 2 - 7, y1:BUY + BUH * i / 6,
      x2:BUX + BUW / 2, y2:BUY + BUH * i / 6, stroke:G1, "stroke-width":0.9}));
  }
  SV2.appendChild(el("rect", {x:BUX - 9, y:BUY + BUH, width:18, height:12,
    fill:"#fff", stroke:G1, "stroke-width":1.4, rx:2}));
  SV2.appendChild(el("path", {d:"M" + (BUX - 4) + " " + (BUY + BUH + 12) +
    " L" + BUX + " " + (TIPY - 4) + " L" + (BUX + 4) + " " + (BUY + BUH + 12) + " Z",
    fill:"#fff", stroke:G1, "stroke-width":1.2}));
  SV2.appendChild(txt(BUX + 84, BUY + 16, "加える液", 11.5, G1));
  SV2.appendChild(txt(BUX + 84, BUY + 32, M.add, 12.5, INK, 700));
  SV2.appendChild(txt(BUX + 84, BUY + 50, "少しずつ加えていく", 11, G1));

  /* --- しずく --- */
  if (T < M.max) {
    for (i = 0; i < 2; i++) {
      var ph = dropT + i * 0.5;
      while (ph > 1) { ph -= 1; }
      var dy = TIPY + (sy - 6 - TIPY) * ph;
      SV2.appendChild(el("ellipse", {cx:BUX, cy:dy, rx:4.2, ry:5.6,
        fill:"#BFD8E8", stroke:SLA, "stroke-width":0.8}));
    }
  }
  if (splash > 0) {
    SV2.appendChild(el("ellipse", {cx:BUX, cy:sy, rx:8 + 16 * (1 - splash), ry:3,
      fill:"none", stroke:SLA, "stroke-width":1.4, opacity:splash}));
  }

  /* --- ビーカー --- */
  SV2.appendChild(el("rect", {x:BKX, y:sy, width:BKW, height:BKY + BKH - sy,
    fill:st[1], opacity:0.28}));
  SV2.appendChild(el("path", {d:"M" + (BKX - 6) + " " + BKY + " L" + BKX + " " + BKY +
    " L" + BKX + " " + (BKY + BKH) + " L" + (BKX + BKW) + " " + (BKY + BKH) +
    " L" + (BKX + BKW) + " " + BKY + " L" + (BKX + BKW + 6) + " " + BKY,
    fill:"none", stroke:G1, "stroke-width":2, "stroke-linejoin":"round"}));
  SV2.appendChild(el("line", {x1:BKX, y1:sy, x2:BKX + BKW, y2:sy,
    stroke:SLA, "stroke-width":1.4, opacity:0.8}));
  SV2.appendChild(txt(BKX + BKW / 2, BKY + BKH + 20, M.beaker + " に加えていく", 12.5, "#444"));
  SV2.appendChild(txt(BKX + BKW / 2, BKY + BKH + 40, M.eq, 13, INK, 700));

  /* --- 粒子 --- */
  var list = [];
  for (i = 0; i < M.species.length; i++) {
    n = Math.round(M.species[i].f(T));
    for (j = 0; j < n; j++) { list.push({sym:M.species[i].sym, c:M.species[i].c}); }
  }
  n = Math.round(M.water(T));
  for (j = 0; j < n; j++) { list.push({sym:"H\u2082O", c:"w"}); }
  var cols = 5, cw = (BKW - 20) / cols;
  var areaTop = sy + 14, areaBot = BKY + BKH - 22;
  var maxRows = Math.max(1, Math.floor((areaBot - areaTop) / 22));
  var rows = Math.ceil(list.length / cols);
  var rh = (rows <= maxRows) ? 22 : (areaBot - areaTop) / maxRows;
  var lim = Math.min(list.length, cols * maxRows);
  for (i = 0; i < lim; i++) {
    var r = Math.floor(i / cols), c = i % cols;
    var px = BKX + 10 + cw * (c + 0.5), py = areaTop + rh * (r + 0.45);
    var fl = list[i].c === "p" ? CP : (list[i].c === "m" ? CM : "#BFD8E8");
    SV2.appendChild(el("circle", {cx:px, cy:py, r:9.6, fill:fl, opacity:0.94}));
    SV2.appendChild(txt(px, py + 3.2, list[i].sym, 7.4,
      list[i].c === "w" ? "#22262B" : "#fff", 700));
  }
  if (list.length > lim) {
    SV2.appendChild(txt(BKX + BKW / 2, BKY + BKH - 6,
      "ほか " + (list.length - lim) + " 個（数は右の表で）", 9.5, "#5B7E96"));
  }
  if (M.precip) {
    var np = Math.round(M.precip(T));
    for (i = 0; i < np; i++) {
      SV2.appendChild(el("rect", {x:BKX + 14 + i * 32, y:BKY + BKH - 15, width:26, height:11,
        fill:"#fff", stroke:G1, "stroke-width":1, rx:2}));
    }
    if (np > 0) {
      SV2.appendChild(txt(BKX + BKW + 46, BKY + BKH - 6, "白い沈殿 BaSO\u2084", 11, G1));
    }
  }

  /* --- BTB と 数 --- */
  SV2.appendChild(el("rect", {x:322, y:120, width:46, height:150, rx:6,
    fill:st[1], opacity:0.8, stroke:G2}));
  SV2.appendChild(txt(345, 290, "BTB溶液", 11.5, G1));
  SV2.appendChild(txt(345, 310, st[0], 15, INK, 700));

  SV2.appendChild(txt(424, 40, "水溶液の中にあるもの", 12.5, G1, 400, "start"));
  var yy = 76;
  for (i = 0; i < M.species.length; i++) {
    SV2.appendChild(el("circle", {cx:440, cy:yy - 4, r:9,
      fill:(M.species[i].c === "p" ? CP : CM), opacity:0.94}));
    SV2.appendChild(txt(462, yy, M.species[i].sym, 13.5,
      M.species[i].c === "p" ? CP : CM, 700, "start"));
    var cnt = Math.round(M.species[i].f(T));
    SV2.appendChild(txt(548, yy, "\u00D7 " + cnt, 13.5, "#22262B", 400, "start"));
    SV2.appendChild(el("rect", {x:592, y:yy - 10, width:Math.max(cnt, 0) * 6.4, height:11,
      fill:(M.species[i].c === "p" ? CP : CM), opacity:0.5, rx:2}));
    yy += 30;
  }
  SV2.appendChild(el("circle", {cx:440, cy:yy - 4, r:9, fill:"#BFD8E8"}));
  SV2.appendChild(txt(462, yy, "H\u2082O", 13.5, "#5B7E96", 700, "start"));
  SV2.appendChild(txt(548, yy, "\u00D7 " + Math.round(M.water(T)), 13.5, "#22262B", 400, "start"));
  if (M.precip) {
    yy += 30;
    SV2.appendChild(el("rect", {x:432, y:yy - 12, width:16, height:9, fill:"#fff", stroke:G1}));
    SV2.appendChild(txt(462, yy, "BaSO\u2084", 13.5, "#666", 700, "start"));
    SV2.appendChild(txt(548, yy, "\u00D7 " + Math.round(M.precip(T)), 13.5, "#22262B", 400, "start"));
  }
  SV2.appendChild(el("line", {x1:424, y1:yy + 16, x2:718, y2:yy + 16, stroke:G3}));
  SV2.appendChild(txt(424, yy + 38, "中性になるのは、加えた量が " + M.neutral + " のとき",
    12, G1, 400, "start"));
}

function drawGraphs() {
  var M = MODES[md], T = vol, i;
  var gc = document.getElementById("graphs");
  while (gc.firstChild) { gc.removeChild(gc.firstChild); }
  for (i = 0; i < M.species.length; i++) {
    (function (s) {
      var d = document.createElement("div"), h = document.createElement("h4"),
          W = 170, H = 112, L = 26, R = 8, TP = 8, BT = 24, sv, a = [], b = [], k, X, Y, cn;
      d.className = "gcard";
      h.style.color = (s.c === "p" ? CP : CM);
      h.innerHTML = s.sym;
      d.appendChild(h);
      sv = el("svg", {viewBox:"0 0 " + W + " " + H});
      sv.appendChild(el("rect", {x:L, y:TP, width:W - L - R, height:H - TP - BT,
        fill:"#fff", stroke:G3}));
      X = function (v) { return L + (W - L - R) * v / M.max; };
      Y = function (v) { return TP + (H - TP - BT) * (1 - v / M.ymax); };
      sv.appendChild(el("line", {x1:X(M.neutral), y1:TP, x2:X(M.neutral), y2:H - BT,
        stroke:G2, "stroke-dasharray":"3 3"}));
      for (k = 0; k <= M.max; k++) { a.push(X(k) + "," + Y(s.f(k))); }
      sv.appendChild(el("polyline", {points:a.join(" "), fill:"none", stroke:G2, "stroke-width":1.4}));
      for (k = 0; k <= T; k++) { b.push(X(k) + "," + Y(s.f(k))); }
      if (b.length > 1) {
        sv.appendChild(el("polyline", {points:b.join(" "), fill:"none",
          stroke:(s.c === "p" ? CP : CM), "stroke-width":2.6}));
      }
      sv.appendChild(el("circle", {cx:X(T), cy:Y(s.f(T)), r:3.6, fill:(s.c === "p" ? CP : CM)}));
      sv.appendChild(txt(L - 4, Y(0) + 4, "0", 9, G1, 400, "end"));
      sv.appendChild(txt(L - 4, Y(M.ymax) + 8, String(M.ymax), 9, G1, 400, "end"));
      sv.appendChild(txt((L + W - R) / 2, H - 6, "加えた量", 9, G1));
      d.appendChild(sv);
      cn = document.createElement("div");
      cn.className = "cnt";
      cn.innerHTML = "いま " + Math.round(s.f(T)) + " 個";
      d.appendChild(cn);
      gc.appendChild(d);
    })(M.species[i]);
  }
}

function draw2() {
  var M = MODES[md], T = vol, st = stateOf(M, T);
  document.getElementById("kvol").innerHTML = String(T);
  var extra = "";
  if (M.precip && T === M.neutral) { extra = "\u3000\u25B6 イオンがないので、電流が流れない"; }
  document.getElementById("kstate").innerHTML = st[0] + "\u3000\u2500\u2500 " + st[2] + extra;
  document.getElementById("note2").innerHTML = M.note;
  document.getElementById("ro2").innerHTML =
    '<span class="pill" style="background:' + st[1] + '33;border-color:' + st[1] + '">' +
    st[0] + '</span><span style="color:#444">中性になるのは、加えた量が <b>' +
    M.neutral + '</b> のとき</span>';
  drawVessel();
  drawGraphs();
}
document.getElementById("vol").oninput = function () { vol = Number(this.value); draw2(); };
document.getElementById("vol").onchange = function () { vol = Number(this.value); draw2(); };
document.getElementById("gonly").onclick = function () {
  gOnly = !gOnly;
  this.className = "btn" + (gOnly ? " on" : "");
  SV2.style.display = gOnly ? "none" : "block";
  draw2();
};
document.getElementById("auto2").onclick = function () {
  autoRun = !autoRun;
  this.className = "btn" + (autoRun ? " on" : "");
  this.innerHTML = autoRun ? "止める" : "少しずつ加える";
};
document.getElementById("reset2").onclick = function () {
  vol = 0; autoRun = false;
  var a = document.getElementById("auto2");
  a.className = "btn"; a.innerHTML = "少しずつ加える";
  document.getElementById("vol").value = 0;
  draw2();
};

(function () {
  var tabs = document.getElementsByClassName("tab"), i;
  for (i = 0; i < tabs.length; i++) {
    tabs[i].onclick = function () {
      var t = document.getElementsByClassName("tab"),
          p = document.getElementsByClassName("panel"), k, n;
      for (k = 0; k < t.length; k++) { t[k].className = "tab"; }
      this.className = "tab on";
      n = Number(this.getAttribute("data-tab"));
      activeTab = n;
      for (k = 0; k < p.length; k++) { p[k].className = "panel" + (k === n ? " on" : ""); }
    };
  }
})();

var last = 0, acc = 0;
function loop(ts) {
  if (!ts) { ts = last + 33; }
  var dt = ts - last;
  if (dt < 0 || dt > 60) { dt = 33; }
  last = ts;
  if (activeTab === 0) {
    draw1(dt);
  } else {
    if (vol < MODES[md].max) {
      dropT += dt * 0.0013;
      while (dropT > 1) { dropT -= 1; splash = 1; }
    }
    if (splash > 0) { splash -= dt * 0.0026; if (splash < 0) { splash = 0; } }
    if (autoRun) {
      acc += dt;
      if (acc > 620) {
        acc = 0;
        if (vol < MODES[md].max) {
          vol += 1;
          document.getElementById("vol").value = vol;
          draw2();
        } else {
          autoRun = false;
          var a = document.getElementById("auto2");
          a.className = "btn"; a.innerHTML = "少しずつ加える";
        }
      }
    }
    if (!gOnly) { drawVessel(); }
  }
  if (window.requestAnimationFrame) { window.requestAnimationFrame(loop); }
  else { window.setTimeout(loop, 33); }
}
build1();
draw2();
if (window.requestAnimationFrame) { window.requestAnimationFrame(loop); }
else { window.setTimeout(loop, 33); }
</script>
</body>
</html>
